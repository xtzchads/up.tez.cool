<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="TezCalm - A calming interface for tracking Tezos staking data in real-time, accompanied by soothing background music and dynamic visuals." />
        <title>TezCalm</title>
        <link rel="icon" type="image/png" href="icons/tezos.png" />
        <link rel="stylesheet" href="css/main.css?v=1.8" />
        <style>
            @import url("https://fonts.googleapis.com/css?family=Monda:400,500,600");

            .header, .header * {
                box-sizing: border-box;
                -webkit-font-smoothing: antialiased;
            }

            .header {
                height: 80px;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                background: 0 0;
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border-bottom: 1px solid rgba(255, 255, 255, 0.26);
                padding: 16px 24px;
                z-index: 100;
                transition: .3s;
                display: flex;
                align-items: center;
                width: 100%;
            }

            .header-content {
                display: flex;
                align-items: center;
                width: 100%;
                justify-content: center;
                max-width: 1400px;
                margin: 0 auto;
            }

            .nav-menu {
                align-items: center;
                display: flex;
                gap: 24px;
                list-style: none;
                margin: 0;
                padding: 0;
                justify-content: center;
            }

            .nav-item {
                color: #ffffff;
                font-family: "Monda", Helvetica, sans-serif;
                font-size: 1rem;
                font-weight: 400;
                padding: 8px 16px;
                border-radius: 16px;
                transition: .3s;
                cursor: pointer;
                position: relative;
                text-decoration: none;
            }

            .nav-item:hover {
                background: rgba(255, 255, 255, 0.01);
                color: #a27cee;
            }

            .nav-item.active {
                background: linear-gradient(180deg, rgba(162, 124, 238, 1) 0%, rgba(127, 75, 231, 1) 100%);
                color: #ffffff;
            }

            @media (max-width: 1200px) {
                .nav-menu {
                    gap: 16px;
                }

                .nav-item {
                    font-size: 0.9rem;
                    padding: 6px 12px;
                }
            }

            @media (max-width: 1024px) {
                .nav-menu {
                    gap: 12px;
                }

                .nav-item {
                    font-size: 0.85rem;
                    padding: 6px 10px;
                }
            }

            @media (max-width: 768px) {
                .header {
                    padding: 12px 16px;
                }

                .nav-menu {
                    gap: 8px;
                    flex-wrap: wrap;
                    justify-content: center;
                }

                .nav-item {
                    font-size: 0.8rem;
                    padding: 4px 8px;
                }
            }

            @media (max-width: 640px) {
                .header {
                    height: 130px;
                    padding: 10px 12px;
                }

                .nav-menu {
                    gap: 6px;
                }

                .nav-item {
                    font-size: 0.75rem;
                    padding: 4px 6px;
                    border-radius: 12px;
                }
            }

            @media (max-width: 480px) {
                .header {
                    padding: 8px 10px;
                }

                .nav-menu {
                    gap: 4px;
                }

                .nav-item {
                    font-size: 0.7rem;
                    padding: 3px 5px;
                    border-radius: 10px;
                }
            }
        </style>
    </head>
    <body>
        <header class="header">
            <div class="header-content">
                <nav class="nav-menu">
                    <a href="https://tez.cool/" class="nav-item">HOME</a>
                    <a href="https://up.tez.cool/" class="nav-item active">TEZCALM</a>
                    <a href="https://tez.cool/map?q=20000" class="nav-item">CHADMAP</a>
                    <a href="https://eye.tez.cool/" class="nav-item">THE EYE OF CHAD</a>
                    <a href="https://stake.tez.cool/" class="nav-item">TEZSTAKE</a>
                    <a href="https://trollbox.tez.cool/" class="nav-item">TEZTROLLBOX</a>
                    <a href="https://secret.tez.cool/" class="nav-item">TEZWHALES</a>
                    <a href="https://chat.tez.cool/" class="nav-item">NFTCHAT</a>
                </nav>
            </div>
        </header>

        <div class="video-container">
            <video id="backgroundVideo" playsinline autoplay loop muted>
                <source src="" type="video/mp4" />
                Your browser does not support HTML5 video.
            </video>
            <video id="preloaderVideo" style="display: none;">
                <source src="" type="video/mp4" />
            </video>
            <div id="overlay" style="display: none;"></div>
        </div>

        <div class="content">
            <div class="button-container">
                <button id="musicButton" class="music-button">
                    <img id="musicIcon" src="icons/silence.png" alt="Audio Icon" />
                </button>
                <button id="shuffleButton" class="music-button">
                    <img id="shuffleIcon" src="icons/shuffle.png" alt="Shuffle Icon" />
                </button>
                <button id="backgroundButton" class="music-button">
                    <img id="backgroundIcon" src="icons/background.png" alt="Background Icon" />
                </button>
            </div>
            <div id="realtimeData" class="realtime-data">Staked ꜩ: 0.000000</div>
            <div class="progress-bar">
                <div id="progress" class="progress"></div>
                <div id="progressText" class="progress-text">0%</div>
            </div>
            <a href="https://github.com/xtzchads/up.tez.cool" class="icon-link" target="_blank">
                <img src="icons/Tezos-social-icon-black-04.png" alt="Tezos Icon" />
            </a>
        </div>

        <audio id="backgroundMusic" loop>
            <source src="" type="audio/mpeg" />
            Your browser does not support the audio element.
        </audio>
        <script src="js/main.js?v=7"></script>
    </body>
</html>
